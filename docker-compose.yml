services:
  db:
    image: postgres:16-alpine
    container_name: aso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: amazon_seller_os
    ports:
      - "5432:5432"
    volumes:
      - aso_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amazon_seller_os"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aso_pgdata:
